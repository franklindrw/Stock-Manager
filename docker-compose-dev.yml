services:
  db:
    container_name: stockmanager-db
    image: postgres:18.2-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockmanager}
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${POSTGRES_DB:-stockmanager} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db_network
    restart:
      always

  app:
    container_name: stockmanager-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-stockmanager}
      DATABASE_URL: "postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-stockmanager}"
    volumes:
      - .:/app
    networks:
      - db_network

volumes:
  postgres_data:

networks:
  db_network:
    driver: bridge
